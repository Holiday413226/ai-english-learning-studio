<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI English Studio — UI Preview</title>
<style>
  :root {
    --bg-root: #0d001a;
    --bg-card: rgba(26, 10, 48, 0.55);
    --bg-card-hover: rgba(26, 10, 48, 0.75);
    --bg-input: #0d001a;
    --bg-sidebar: rgba(16, 5, 32, 0.85);
    --border-subtle: #2d1050;
    --border-default: #3d1a60;
    --border-accent: #5a2d8a;
    --text-primary: #e0dde8;
    --text-secondary: #9b8ab8;
    --text-muted: #6a5a8a;
    --accent: #50fa7b;
    --accent-dim: #2d8a4a;
    --accent-glow: rgba(80, 250, 123, 0.12);
    --danger: #ff6b8a;
    --danger-bg: #5a1a2a;
    --highlight: #87ceeb;
    --gold: #ffd700;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
    --font: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-root);
    color: var(--text-primary);
    font-family: var(--font);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ──────────────────────────────────── */
  .app-layout {
    display: flex;
    min-height: 100vh;
    max-height: 100vh;
  }

  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backdrop-filter: blur(12px);
  }

  .sidebar-brand {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .sidebar-logo {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .sidebar-sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 400;
  }

  .sidebar-nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px 8px;
    gap: 2px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 14px;
    border: none;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 0.82rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    font-weight: 450;
  }

  .sidebar-item:hover {
    background: rgba(80, 250, 123, 0.05);
    color: var(--text-primary);
